# This is a Databricks asset bundle definition for football_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: football_analytics
  uuid: 4ad96c93-d3b2-418e-86c9-fb07fb452dd9

include:
  - resources/*.yml
  - resources/**/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: football_dev 
    description: The catalog to use
  dev_flag:
    default: true
    

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405612200933438.18.azuredatabricks.net
    variables:
      catalog:
        default: football_dev
      dev_flag:
        default: true
    presets:
      artifacts_dynamic_version: true
  test:
    mode: production
    workspace:
      host: https://adb-7405607648433478.18.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ishfaqmmalik@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: 
        default: football_test
      dev_flag:
        default: false
      
    permissions:
      - user_name: ishfaqmmalik@outlook.com
        level: CAN_MANAGE
  
  prod:
    mode: production
    workspace:
      host: https://adb-7405609543179080.0.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ishfaqmmalik@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: 
        default: football_prod
      dev_flag:
        default: false
    permissions:
      - user_name: ishfaqmmalik@outlook.com
        level: CAN_MANAGE
