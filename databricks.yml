    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405612200933438.18.azuredatabricks.net
    variables:
      catalog:
        default: football_dev
      dev_flag:
        default: true
      container:
        default: f1-dev
      warehouse_id:
        default: 0a9078df66d5fbb4
    presets:
      artifacts_dynamic_version: true
  test:
    mode: production
    workspace:
      host: https://adb-7405607648433478.18.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ishfaqmmalik@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: 
        default: football_test
      dev_flag:
        default: false
      container:
        default: f1-test
      warehouse_id:
        default: f8034f4188472bfd
      
    permissions:
      - service_principal_name: 06dc8a1f-5666-4cdd-adb0-f08ed6f9ac1a
