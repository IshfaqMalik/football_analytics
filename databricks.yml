bundle:
  name: football_analytics
  uuid: 4ad96c93-d3b2-418e-86c9-fb07fb452dd9

include:
  - resources/*.yml
  - resources/**/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: football_dev 
    description: The catalog to use
  dev_flag:
    default: true
  container:
    default: f1-dev
  warehouse_id:
    default: 0a9078df66d5fbb4
    

targets:
