
version: 2
models:
  - name: team_performances
    description: "Football team performances across all leagues"

    columns:
      - name: team_id
        description: "Unique identifier for the team"
        data_tests:
          - unique
          - not_null

      - name: team
        description: "Team name"

      - name: total_matches
        description: "Total matches played"

      - name: total_goals_scored
        description: "Total goals scored"

      - name: goals_scored_home
        description: "Goals scored in home matches"

      - name: goals_scored_away
        description: "Goals scored in away matches"

      - name: total_goals_conceded
        description: "Total goals conceded"

      - name: goals_conceded_home
        description: "Goals conceded in home matches"

      - name: goals_conceded_away
        description: "Goals conceded in away matches"

      - name: total_wins
