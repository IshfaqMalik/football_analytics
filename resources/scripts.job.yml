resources:
  jobs:
    football_analytics:
      name: football_analytics
      tasks:
        - task_key: bronze
          spark_python_task:
            python_file: ../football-pipeline/bronze/ingestion.py
            parameters:
              - "{{job.id}}"
              - "{{job.run_id}}"
              - "{{task.run_id}}"
              - "{{job.start_time.iso_datetime}}"
              - "${var.catalog}"
          job_cluster_key: football_cluster
        - task_key: silver
          depends_on:
            - task_key: bronze
          spark_python_task:
            python_file: ../football-pipeline/silver/transformation.py
            parameters:
              - "${var.catalog}"
          job_cluster_key: football_cluster
        - task_key: gold
          depends_on:
            - task_key: silver
          spark_python_task:
            python_file: ../football-pipeline/gold/gold_layer.py
            parameters:
              - "${var.catalog}"
          job_cluster_key: football_cluster
      job_clusters:
        - job_cluster_key: football_cluster
          new_cluster: "${var.football_cluster}"
      
    